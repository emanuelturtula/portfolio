# Runtime manifest for the Raspberry Pi. Uploaded by the delivery pipeline for each
# deployment, which stages it in ~/portfolio-app/prod/incoming/ and, once the container is
# healthy, keeps it as ~/portfolio-app/prod/compose.yml. Nothing else persists on the host
# except the two volumes -- the data and the scheduled backups -- and that deployment state.
#
# Every PORTFOLIO_* variable below is set by deploy.py, or by the compose.sh it writes
# beside the live copy. Run compose on the host through that script (docs/operations.md),
# not against this file directly, or compose refuses for want of those variables.
#
# The compose project name (portfolio-app-prod) is chosen by deploy.py. It was made to
# differ from the legacy `portfolio-prod` project so the two could run side by side until
# the legacy application was decommissioned (#25). It stays as it is: compose names the
# volumes after the project, so renaming it would start production on empty ones.

services:
  app:
    image: ${PORTFOLIO_IMAGE:?An immutable image digest is required}
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_PORT:?A host port is required}:8000"
    environment:
      PORTFOLIO_ENVIRONMENT: ${PORTFOLIO_ENVIRONMENT:?An environment name is required}
      PORTFOLIO_DATABASE_URL: sqlite+aiosqlite:////app/data/portfolio.db
      # The scheduled copies of the database (#22), on the second volume below, so that
      # removing the data volume does not remove them. Each copy holds the owner's complete
      # financial data, as the database does. docs/operations.md, section 17.
      PORTFOLIO_BACKUP_DIR: /app/backups
    # Application secrets (the bootstrap password, price provider keys) live in a
    # host-local file, ~/portfolio-app/prod/secrets.env, that deploy.py guarantees exists at
    # mode 0600. They are written once over SSH by the operator and never pass through
    # GitHub Actions. The /dev/null default keeps compose valid before that file has any
    # content.
    #
    # The authentication variable lives in that same file rather than here, because it is
    # a credential and may not enter the repository:
    #
    #   PORTFOLIO_BOOTSTRAP_PASSWORD optional; creates the account on first start and is
    #                                ignored once one exists. Prefer `create-user`, which
    #                                prompts and leaves no copy on disk.
    #
    # They are NOT declared as required compose variables: the script that supplies those
    # lives on the host, not in this repository, so a `${VAR:?}` entry nothing sets would
    # fail every deployment at `docker compose up`.
    env_file:
      - ${PORTFOLIO_SECRETS_ENV_FILE:-/dev/null}
    volumes:
      - data:/app/data
      - backups:/app/backups
    # Asserts both halves of the image: the API answers, and the single-page application
    # is actually being served. A container that starts but serves no UI is not healthy.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); assert d['status']=='ok'; r=urllib.request.urlopen('http://127.0.0.1:8000/',timeout=5); assert r.status==200 and b'<html' in r.read().lower()"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  backups:
