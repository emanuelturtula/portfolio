name: CI

# Every third-party action is pinned to a commit SHA with the version in a comment. A
# floating tag is mutable, and this workflow has access to the repository contents.
#
# The job names below are the required status check contexts in the `main` ruleset, so
# renaming one silently disables a merge gate. Change them together or not at all.
#
# Every job sets timeout-minutes. Without it, a hang runs until GitHub's default of 360
# minutes, so the run fails six hours late and holds a runner the whole time. The backend
# hang found while reviewing #10 would have done exactly that. Each number is at least
# five times the slowest run of its job across every completed CI and Delivery run from
# 2026-09-20 to 2026-09-25 (54 runs), rounded up to a multiple of five minutes. The
# measured maximum sits beside each one. When a job outgrows its number, measure again
# and raise both. tests/deploy/test_workflow_timeouts.py fails any job that has none.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5 # slowest: 11 s
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan covers the whole history, not just this diff: a secret in an older
          # commit is still published the moment the branch is pushed.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned and checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: Scan the full git history
        run: python3 scripts/secret_scan.py --history

  lint:
    name: Lint & types
    needs: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5 # slowest: 54 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: backend
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: ruff format
        working-directory: backend
        run: uv run ruff format --check .
      - name: mypy
        working-directory: backend
        run: uv run mypy
      - name: Import layering contract
        working-directory: backend
        run: uv run lint-imports

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: prettier
        working-directory: frontend
        run: npm run format:check
      - name: tsc
        working-directory: frontend
        run: npm run typecheck

  test-backend:
    name: Backend tests
    needs: secrets-scan
    runs-on: ubuntu-latest
    # Slowest completed: 14.1 min, across the 27 completed CI and Delivery runs from
    # 2026-09-29 to 2026-10-04. Almost all of it is pytest, and that step grows with every
    # issue. The Delivery run for #130 went past the old 15 and was cancelled before it
    # deployed. This number is the guard's ceiling (MAX_TIMEOUT_MINUTES), about twice the
    # slowest run, not five times: five times would be 75 minutes, which no longer bounds
    # anything. Making the suite faster is the way back under the rule. The 30 s per-test
    # ceiling in backend/pyproject.toml ends a hang inside a test sooner, with every
    # thread's stack. This bounds everything outside a test: installing, collecting, and a
    # process that never exits because something left a thread running.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that `origin/main` and the merge base are there for the
          # changed-lines step below to compare against (#23).
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --locked
        working-directory: backend
      - name: Runner CPU
        # The same 9,467 tests took 10.6 min on one runner and 16.0 on another on 2026-10-04,
        # so a duration means little without the machine it ran on. Printed for the next
        # person who measures this job.
        run: lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket):'
      - name: pytest with coverage
        working-directory: backend
        # The reports are for the steps after it -- the JSON for the domain floor, the
        # Cobertura XML for the changed lines -- and go to the runner's temporary directory
        # so that nothing lands in the checkout.
        #
        # `--numprocesses=auto` is one pytest-xdist worker per CPU the runner reports. Each
        # worker measures its own share, and pytest-cov combines them before it writes any
        # report, so both floors and the changed-lines step read one run. Checked against a
        # serial run of the same commit: the same lines and branches, file by file.
        # `--dist=worksteal` lets an idle worker take queued tests from a busy one; the
        # Hypothesis and performance tests run for seconds where most run for milliseconds,
        # and it finished 15% sooner than the default split. `--durations=25` puts the
        # slowest tests in the log, so the next time this job grows, the log already says
        # where.
        run: uv run pytest --numprocesses=auto --dist=worksteal --durations=25 --cov --cov-report=term-missing --cov-report="json:$RUNNER_TEMP/coverage.json" --cov-report="xml:$RUNNER_TEMP/coverage.xml"
      - name: Domain coverage floor
        # Criterion 13 of #17: 95% of lines and 90% of branches under src/portfolio/domain/,
        # on top of the repository-wide floor in backend/pyproject.toml, which one number
        # over everything would let the accounting engine slip under. Standard library only,
        # so it needs nothing the backend installs; it fails closed on a report it cannot use.
        run: python3 scripts/domain_coverage.py "$RUNNER_TEMP/coverage.json"
      - name: Changed-lines coverage
        # #23: 90% of the lines this pull request adds or changes under backend/, which the
        # floors above cannot see -- a well-covered codebase carries a new module that no
        # test runs. Pull requests only: on main, called from Delivery, there is no diff.
        # `--compare-branch=origin/main` diffs from the merge base, hence the full fetch.
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: uv run diff-cover "$RUNNER_TEMP/coverage.xml" --compare-branch=origin/main --fail-under=90
      - name: Deployment guardrail tests
        # Plain unittest, no dependencies: these protect the path from a workflow run to a
        # production deployment, so they must run even if the backend fails to install.
        run: python3 -m unittest discover -s tests/deploy -v
      - name: Agent hook guardrail tests
        # Likewise dependency-free: these protect the PreToolUse guards, which fail closed
        # and wedge a session when a hook command stops resolving.
        run: python3 -m unittest discover -s tests/agent -v

  test-frontend:
    name: Frontend tests
    needs: secrets-scan
    runs-on: ubuntu-latest
    # Slowest: 52 s, measured before #23 added the uv install and the changed-lines step to
    # pull requests. 10 rather than 5 until a run with them has been measured.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the changed-lines step's comparison with `origin/main`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: vitest with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build the production bundle
        working-directory: frontend
        run: npm run build
      # diff-cover is a backend dev dependency, pinned by backend/uv.lock, so the frontend's
      # changed lines are held to the same tool at the same version as the backend's.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: github.event_name == 'pull_request'
        with:
          enable-cache: true
          working-directory: backend
      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: uv sync --locked
      - name: Changed-lines coverage
        # #23: 90% of the lines this pull request adds or changes under frontend/, read
        # from the LCOV report the vitest step wrote. Its paths are relative to the
        # repository root (see `projectRoot` in vite.config.ts): relative to frontend/ they
        # would match no changed file, and every pull request would pass with nothing
        # measured. Pull requests only, as in the backend job.
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: uv run --locked --project ../backend diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=90

  openapi-drift:
    name: OpenAPI drift
    needs: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15 # slowest: 125 s, an outlier; the median is 18 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Dump the OpenAPI schema
        working-directory: backend
        run: uv run python ../scripts/dump_openapi.py --output ../openapi.json
      - name: Regenerate the TypeScript API types
        working-directory: frontend
        run: npm run gen:api
      - name: Fail if the committed types are out of date
        run: |
          # --intent-to-add first: plain 'git diff' does not see untracked files, so a
          # brand new generated file would pass this check without ever being committed.
          git add --intent-to-add frontend/src/api/generated/
          if ! git diff --exit-code -- frontend/src/api/generated/; then
            echo "::error::The generated API types do not match the backend schema. Run 'uv run python ../scripts/dump_openapi.py' in backend/, then 'npm run gen:api' in frontend/, and commit the result."
            exit 1
          fi

  docker-build:
    name: Docker build (arm64)
    needs: [lint, test-backend, test-frontend]
    runs-on: ubuntu-24.04-arm
    # Slowest: 84 s, and that was a build with no layer cache at all (every layer ran), so
    # an evicted cache is already inside the measurement. Delivery's build of the same
    # Dockerfile peaked at 101 s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Native arm64 runner, so no QEMU emulation and no 20-minute builds. The target
          # is a Raspberry Pi 5, so this is also the only architecture that matters.
          platforms: linux/arm64
          push: false
          tags: portfolio:ci
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
