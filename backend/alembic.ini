# Developer CLI entry point for Alembic. Nothing at runtime reads this file: the
# application and the tests build an equivalent Config in code, through
# `portfolio.db.alembic_config.build_alembic_config`.
#
# There is deliberately no `sqlalchemy.url` here. Duplicating the database URL means one
# of the two copies is wrong, and the wrong one is always the production one. `env.py`
# resolves the URL from the Config it was handed, falling back to Settings.
#
# The logging configuration below is read only when the CLI is driving -- it is what makes
# `alembic upgrade` say which revisions it ran. The application never reaches it: it builds
# a Config with no file behind it, and `portfolio.logging` owns logging in that process.

[alembic]
# Resolved against this file's own directory, so `alembic` works from anywhere.
script_location = %(here)s/src/portfolio/db/migrations

# Revision ids are readable slugs (`0001_initial_schema`), and the id alone already
# carries the description, so the filename is just the id.
file_template = %%(rev)s

path_separator = os

prepend_sys_path = %(here)s/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
