[project]
name = "portfolio"
# Placeholder only. The real version is derived from the git tag during the CI build
# and injected into the running container through the PORTFOLIO_VERSION environment
# variable, so this number is never bumped by hand.
version = "0.0.0"
description = "Backend for a self-hosted crypto investment portfolio tracker."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "alembic",
    # Already present transitively through Starlette, but the lifespan calls
    # anyio.to_thread.run_sync directly, so it is declared directly too.
    "anyio",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "mypy",
    "ruff",
    "import-linter",
    # Base-unit conversion is the kind of arithmetic where the failing input is one
    # nobody thinks to write down by hand, so the round trip is asserted over generated
    # decimals rather than over a handful of examples.
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ is non-negotiable here: a portfolio is a time-ordered event log, and a naive
# datetime silently corrupts it the moment a trade timestamp crosses a DST boundary
# or the host runs in a different timezone than the exchange.
# T20 keeps print() out of the code base: this process logs structured JSON to stdout,
# and a stray print injects an unparseable line into the log stream.
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "SIM",
    "TC",
    "PTH",
    "RUF",
    "ASYNC",
    "S",
    "ERA",
    "PT",
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy resolves `Mapped[...]` annotations at runtime to build the mapper, so the
# names inside them must be real imports. Without this, TC003 would move `datetime` into
# an `if TYPE_CHECKING:` block and every mapped class would fail to configure.
#
# `pydantic.BaseModel` is here for the same reason: Pydantic resolves a model's annotations
# at class-creation time. Without it, the first response model with a `MoneyStr` field trips
# TC001, and ruff's suggested fix -- move the import into `if TYPE_CHECKING:` -- breaks the
# model at runtime. An autofix that is confidently wrong is worse than a missing rule.
# `pydantic_settings.BaseSettings` is the same case and does not bite today only because
# `config.py` has no `from __future__ import annotations`, which is house style everywhere
# else. Adding that one line to it would be enough.
runtime-evaluated-base-classes = [
    "sqlalchemy.orm.DeclarativeBase",
    "portfolio.db.base.Base",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.flake8-builtins]
# portfolio.logging is always imported absolutely, so it cannot shadow the standard
# library module for anyone; the name says exactly what the module configures.
builtins-allowed-modules = ["logging"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
# A directory, not the package name. Coverage matches a package source against the
# module's `__name__`, and Alembic loads `env.py` and every revision script by path, so
# they arrive named `env` and `v0001_initial_schema` rather than `portfolio.db....`.
# Under `source = ["portfolio"]` they were silently never traced -- reported at 0% while
# demonstrably running every migration in the suite. Matching on the directory measures
# what actually executes.
source = ["src/portfolio"]
branch = true

[tool.coverage.report]
# The skeleton starts at 70 and this number only ever ratchets upward: raise it as
# behaviour lands, never lower it to make a red build green.
#
# 70 -> 97 with the database foundation (#1). 97 -> 98 with money persistence (#2),
# measured at 99.42%.
#
# Exactly what is uncovered, because the note written here at the 98 ratchet said "the
# same three misses, none of them reachable" and that was wrong on both counts. There are
# three, and one of them was reachable by a single request -- `spa.py`'s third cache-header
# arm, now covered by a test for a root file that is neither hashed nor the entry point.
#
# What is left: one statement, `web/spa.py:52` (the re-raise of a non-404), and two
# branches, the `if dialect.name == "sqlite"` guards in the two engine factories. Those
# genuinely need a non-SQLite async driver that is not a dependency and should not become
# one. A floor of 99 would leave 0.4 points, which is inside the noise a single refactor
# makes in branch coverage.
fail_under = 98
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
]
