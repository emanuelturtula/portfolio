[project]
name = "portfolio"
# Placeholder only. The real version is derived from the git tag during the CI build
# and injected into the running container through the PORTFOLIO_VERSION environment
# variable, so this number is never bumped by hand.
version = "0.0.0"
description = "Backend for a self-hosted crypto investment portfolio tracker."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    # Argon2id is the password hash: memory hard, so a GPU farm buys far less than it does
    # against PBKDF2 or bcrypt. The cost parameters are settings rather than constants
    # because the number that matters is the one measured on the Raspberry Pi.
    "argon2-cffi",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "alembic",
    # Already present transitively through Starlette, but the lifespan calls
    # anyio.to_thread.run_sync directly, so it is declared directly too.
    "anyio",
    # Runtime rather than dev since #6: `providers/http.py` is the shared client every
    # chain provider makes its calls through, and it ships in the image. It was already
    # installed everywhere as a test dependency -- `httpx.ASGITransport` is what drives
    # the API tests -- so nothing new is downloaded; what changes is that the arm64 image
    # now depends on it being there, which is the build that would notice if it were not.
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "import-linter",
    # Base-unit conversion is the kind of arithmetic where the failing input is one
    # nobody thinks to write down by hand, so the round trip is asserted over generated
    # decimals rather than over a handful of examples.
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ is non-negotiable here: a portfolio is a time-ordered event log, and a naive
# datetime silently corrupts it the moment a trade timestamp crosses a DST boundary
# or the host runs in a different timezone than the exchange.
# T20 keeps print() out of the code base: this process logs structured JSON to stdout,
# and a stray print injects an unparseable line into the log stream.
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "SIM",
    "TC",
    "PTH",
    "RUF",
    "ASYNC",
    "S",
    "ERA",
    "PT",
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy resolves `Mapped[...]` annotations at runtime to build the mapper, so the
# names inside them must be real imports. Without this, TC003 would move `datetime` into
# an `if TYPE_CHECKING:` block and every mapped class would fail to configure.
#
# `pydantic.BaseModel` is here for the same reason: Pydantic resolves a model's annotations
# at class-creation time. Without it, the first response model with a `MoneyStr` field trips
# TC001, and ruff's suggested fix -- move the import into `if TYPE_CHECKING:` -- breaks the
# model at runtime. An autofix that is confidently wrong is worse than a missing rule.
# `pydantic_settings.BaseSettings` is the same case and does not bite today only because
# `config.py` has no `from __future__ import annotations`, which is house style everywhere
# else. Adding that one line to it would be enough.
runtime-evaluated-base-classes = [
    "sqlalchemy.orm.DeclarativeBase",
    "portfolio.db.base.Base",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.flake8-builtins]
# portfolio.logging is always imported absolutely, so it cannot shadow the standard
# library module for anyone; the name says exactly what the module configures.
builtins-allowed-modules = ["logging"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
# A directory, not the package name. Coverage matches a package source against the
# module's `__name__`, and Alembic loads `env.py` and every revision script by path, so
# they arrive named `env` and `v0001_initial_schema` rather than `portfolio.db....`.
# Under `source = ["portfolio"]` they were silently never traced -- reported at 0% while
# demonstrably running every migration in the suite. Matching on the directory measures
# what actually executes.
source = ["src/portfolio"]
branch = true
# Both, and neither is optional. SQLAlchemy's asyncio layer runs its work inside a
# greenlet, so without "greenlet" every line of an `async def` after its first `await` on
# a session goes untraced -- `services/auth.py` reported 58% while demonstrably running
# end to end. FastAPI runs a *synchronous* dependency in a worker thread, and naming a
# concurrency library turns off the thread tracing coverage does by default, so dropping
# "thread" hides `api/dependencies.py` instead. Measuring one of the two is worse than
# measuring neither, because the number looks plausible.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# The skeleton starts at 70 and this number only ever ratchets upward: raise it as
# behaviour lands, never lower it to make a red build green.
#
# 70 -> 97 with the database foundation (#1). 97 -> 98 with money persistence (#2),
# measured at 99.42%. 98 -> 99 with authentication (#3), measured at 99.70% over 1136
# statements and 176 branches.
#
# Exactly what is uncovered, because the note written here at the 98 ratchet said "the
# same three misses, none of them reachable" and that was wrong on both counts. There are
# three, and one of them was reachable by a single request -- `spa.py`'s third cache-header
# arm, now covered by a test for a root file that is neither hashed nor the entry point.
#
# What is left is unchanged by #3: one statement, `web/spa.py:52` (the re-raise of a
# non-404), and its partial branch, plus the two `if dialect.name == "sqlite"` guards in
# the engine factories. Those genuinely need a non-SQLite async driver that is not a
# dependency and should not become one. Together they are 0.30 points, and no test can
# take them back.
#
# 99 rather than 99.5, at the #3 ratchet: the gap between the floor and the measured 99.70
# is the headroom a refactor gets before it has to argue about coverage, and 0.70 points is
# roughly nine statements or branches. At 99.5 it would be two or three, which is not
# headroom -- it is a floor that fails on a change that has nothing to do with testing, and
# a floor that fails for the wrong reason is one the next person lowers. That is how a
# ratchet breaks.
#
# 99 -> 99.5 with the chain provider seam (#6), measured at 99.83% over 1960 statements and
# 332 branches. **The number did not move; the base did.** The reasoning above is unchanged
# and is what decides this: nine units of headroom is the standard it set, and 0.33 points
# of a codebase that has grown from 1136 statements to 1960 is now about seven and a half
# units rather than the two or three it would have bought at #3. A percentage point is
# worth more than it used to be, which is the only reason 99.5 is acceptable today and was
# not then.
#
# The three misses are still the same three and still cannot be taken back, so they are
# 0.17 points now rather than 0.30. `providers/` contributes none of them: the package
# added by #6 is fully covered, including both refusal branches that a review added late.
#
# **99.5 held at the Bitcoin provider (#7)**, measured at 99.84% over 2157 statements and
# 376 branches. Not an oversight, and not a ratchet skipped out of convenience: the
# standard this comment set at #3 is nine units of headroom, and 0.34 points of 2533 units
# is about eight and a half. Raising the floor to 99.7 would leave three and a half, which
# is the two-or-three situation the paragraph above rejects by name -- a floor that fails
# on a change that has nothing to do with testing is one the next person lowers. The floor
# moves again when the base grows enough to pay for it, which is the same argument that
# moved it at #6.
#
# The three misses are 0.16 points now. `providers/chains/bitcoin.py` contributes none.
#
# **99.5 held again at the Kaspa provider (#8)**, measured 99.86% over 2459 statements and
# 460 branches. The same arithmetic as #7, against the same nine-unit standard: 0.36 points
# of 2919 units is about ten and a half units of headroom, and 99.6 would cut that to seven
# and a half. The base has to grow before the number can.
#
# **99.5 -> 99.6 with the price provider (#9)**, measured 99.89% over 3084 statements and 556
# branches. The base grew, so the number moves: 0.39 points of 3640 units is about fourteen
# units of headroom, and 99.6 leaves about ten and a half -- still above the nine-unit
# standard, where 99.7 would leave under seven and is correctly out of reach. This is the
# first ratchet since #6, and it is the same arithmetic that held the floor twice; what
# changed is the denominator, not the argument.
#
# The three remaining misses are still the same three, now 0.11 points. The whole of
# `providers/prices/`, the prices repository, both services and the new migration are fully
# covered.
#
# **99.6 -> 99.7 with the balance sync (#10)**, measured 99.91% over 3853 statements and 636
# branches. 0.31 points of 4489 units is about fourteen units of headroom; 99.7 leaves about
# nine and a half, which clears the nine-unit standard by half a unit, and 99.8 would leave
# five. Half a unit is thin, and it is stated rather than rounded up: the next change that
# adds an unreachable branch should expect to argue for it rather than find room.
#
# The misses are the same three lines, now 0.09 points -- four units: `web/spa.py:52` and its
# partial branch, and the two engine guards. Every module #10 added is fully covered, and it
# got there because the first measurement was 99.44% against a 99.6 floor: the tester added
# tests for eight uncovered #10 branches rather than anyone asking for the floor to move.
#
# **99.7 held at the exchange provider seam (#12)**, measured 99.93% over 4572 statements and
# 830 branches. 0.23 points of 5402 units is about twelve units of headroom. 99.8 would leave
# under seven, below the nine-unit standard, so the floor waits for the base to grow, as it did
# at #7 and #8. The misses are the same four units as at #10. The whole of
# `providers/exchanges/` is fully covered, including every refusal arm review added. The first
# measurement was 99.48% against this floor, and the tester closed it by writing tests for the
# eighteen uncovered lines.
fail_under = 99.7
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
]
